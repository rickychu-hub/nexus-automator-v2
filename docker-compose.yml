version: '3.8'

services:
  # 🧠 "El Cerebro" (FastAPI)
  backend:
    build: ./backend
    container_name: nexus-backend
    ports:
      - "8000:8000"
    # El backend ya no necesita montar el volumen físico de chroma
    # porque ahora hablará con el servidor chromadb por red HTTP.
    volumes:
      - ./backend/app:/app/app
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 👋 "El Rostro" (Streamlit)
  frontend:
    build: ./frontend
    container_name: nexus-frontend
    ports:
      - "8501:8501"
    environment:
      - INTERVIEW_URL=http://backend:8000/interview/
      - GENERATION_URL=http://backend:8000/create-workflow-streaming/
    depends_on:
      - backend
        
    restart: unless-stopped
    volumes:
      - ./frontend/app.py:/app/app.py

  # ✋ "Las Manos" (n8n)
  n8n:
    image: n8nio/n8n:latest
    container_name: nexus-n8n
    ports:
      - "5678:5678"
    env_file:
      - ./n8n/.env
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
      
  # 🚛 "El Suministro" (Script de carga)
  data-pipeline:
    build: ./data_pipeline
    container_name: nexus-data-pipeline
    # Ya no necesita el volumen físico, solo conexión de red
    env_file:
      - ./data_pipeline/.env
    depends_on:
    - chromadb  
        #condition: service_healthy  # <--- OBLIGATORIO: Esperar al healthcheck
    restart: on-failure             # <--- Si falla, vuelve a intentarlo

  # 💾 "La Memoria" (Nuevo Servidor ChromaDB)
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: nexus-chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
   # healthcheck:
     # test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      #interval: 30s
      #timeout: 10s
      #retries: 3
    restart: unless-stopped

# Volúmenes gestionados
volumes:
  n8n_data:
    driver: local
  chroma_data:
    driver: local